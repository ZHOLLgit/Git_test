<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试网页 · Git_test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #e8f1f2;
  }
  .card {
    max-width: 560px;
    margin: 24px;
    padding: 48px 40px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    text-align: center;
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 1.9rem; letter-spacing: 0.04em; margin-bottom: 10px; }
  .badge {
    display: inline-block;
    padding: 4px 14px;
    margin-bottom: 26px;
    border-radius: 999px;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    background: rgba(80, 250, 200, 0.15);
    border: 1px solid rgba(80, 250, 200, 0.4);
    color: #6ef7cf;
  }
  p { line-height: 1.8; color: #c9d6df; margin-bottom: 26px; }
  #clock {
    font-size: 2.2rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    margin-bottom: 6px;
  }
  #date { font-size: 0.9rem; color: #9fb3bd; margin-bottom: 30px; }
  .meta {
    font-size: 0.78rem;
    color: #8aa0ab;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 18px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>测试网页运行正常 ✅</h1>
    <span class="badge">TEST PAGE</span>
    <p>这是仓库 ZHOLLgit/Git_test 的一个测试页面，用于验证提交与部署链路。页面完全离线自包含，无任何外部依赖。</p>
    <div id="clock">--:--:--</div>
    <div id="date">加载中…</div>
    <div class="meta">dsh-superagent 设置验证 · 提交于 2026-11-01</div>
  </main>
  <script>
    const clock = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    function tick() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      dateEl.textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日 · 星期${'日一二三四五六'[now.getDay()]}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
